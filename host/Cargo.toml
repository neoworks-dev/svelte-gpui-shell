[package]
name = "svelte_gpui_host"
version = "0.0.1"
edition = "2024"

[lib]
name = "svelte_gpui"
path = "src/lib.rs"

[[bin]]
name = "svelte-gpui"
path = "src/main.rs"

[features]
default = ["video"]
# `Video`, played through GStreamer, which the host then links against and needs installed.
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[build-dependencies]
serde_json = "1"

[dependencies]
gpui = { path = "../../gpui/crates/gpui" }
gpui_platform = { path = "../../gpui/crates/gpui_platform", features = ["font-kit", "wayland", "x11"] }
rquickjs = "0.14.0"
serde_json = "1"
tiny-skia = "0.11"
smallvec = "1"
ureq = "2"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
futures = "0.3"
notify = "8"
polling = "3"
libc = "0.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
